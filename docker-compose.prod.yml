# Production. Needs .env.prod (copy .env.prod.example) on the server.
#   npm run docker:prod:up       build and start the portal
#   npm run docker:prod:migrate  apply database migrations
#   npm run docker:prod:seed     add the main categories (safe to repeat)
name: portal-prod

# Built from POSTGRES_* so it always points at the db container. DATABASE_URL in .env.prod
# is only for tools you run by hand.
x-database-url: &database-url postgresql://${POSTGRES_USER:?set POSTGRES_USER in the env file}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in the env file}

services:
  # The only published service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: .env.prod
    environment:
      # Fixed inside Docker: nginx and the health check rely on it
      PORT: "4000"
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads-prod:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # One-off: runs prisma migrate deploy. Built from the "build" stage because the
  # prod image has no prisma CLI or tsx. Seed with: run --rm migrate npm run seed:prod
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    env_file: .env.prod
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    profiles: ["tools"]

  # Not published outside Docker
  db:
    image: postgres:16.15-bookworm
    env_file: .env.prod
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Nightly pg_dump at 02:00 UTC, keeps 14 days (see docker/backup.sh)
  backup:
    image: postgres:16.15-bookworm
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/backup.sh"]
    volumes:
      - backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    restart: unless-stopped

volumes:
  pgdata-prod:
  uploads-prod:
  backups:
